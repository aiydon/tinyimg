name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format
        run: uv format --check
      - name: Type
        run: uv tool run ty check src/imagepress
      - name: Test
        run: uv run pytest -q

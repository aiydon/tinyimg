[project]
name = "tinyimg"
version = "0.3.0"
description = "Perceptual image compression with Pydantic and Click"
readme = "README.md"
authors = [
    { name = "iydon", email = "liangiydon@gmail.com" }
]
requires-python = ">=3.12"
keywords = [
    "image",
    "compression",
    "tinypng",
    "png",
    "jpeg",
    "webp",
    "avif",
    "ssim",
    "ciede2000",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "imagequant>=1.1",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.10",
    "pyoxipng>=9.1",
]

[project.optional-dependencies]
avif = ["pillow-avif-plugin>=1.6.0"]
full = ["pillow-avif-plugin>=1.6.0"]

[project.scripts]
tinyimg = "tinyimg.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow-avif-plugin>=1.6.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
